
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Print Order Confirmation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f6f7f9;
      color: #17191d;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 44px 32px;
      border-radius: 22px;
      background: #fff;
      text-align: center;
      box-shadow: 0 12px 48px rgba(0,0,0,.06);
    }

    .symbol {
      width: 68px;
      height: 68px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e9f8ef;
      color: #178345;
      font-size: 34px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 27px;
      letter-spacing: -.8px;
    }

    p {
      margin: 0;
      color: #626975;
      font-size: 15px;
      line-height: 1.7;
    }

    .footer {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid #edf0f2;
      color: #969ca5;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="card" role="status" aria-live="polite">
    <div class="symbol" id="symbol">…</div>

    <h1 id="title">Verifying payment</h1>

    <p id="message">
      Please wait while we confirm your print order.
    </p>

    <div class="footer">
      Secure checkout powered by Stripe
    </div>
  </main>

  <script>
    "use strict";

    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const symbol = document.getElementById("symbol");

    function show(status) {
      if (status === "paid") {
        symbol.textContent = "✓";
        title.textContent = "Payment confirmed!";
        message.textContent =
          "Thank you for your order. Your photo prints " +
          "will be processed for fulfillment.";
        return;
      }

      symbol.textContent = "!";
      symbol.style.background = "#fff3df";
      symbol.style.color = "#986500";

      if (status === "processing") {
        title.textContent = "Payment processing";
        message.textContent =
          "Your payment has not been confirmed yet. " +
          "Please check your Stripe receipt or contact " +
          "the photo booth operator before ordering again.";
        return;
      }

      title.textContent = "Unable to confirm payment";
      message.textContent =
        "We couldn't verify this checkout. " +
        "Please check your payment receipt or contact " +
        "the photo booth operator for assistance.";
    }

    async function verify() {
      const params = new URLSearchParams(location.search);
      const sessionId = params.get("session_id");

      if (!sessionId) {
        show("error");
        return;
      }

      try {
        const response = await fetch(
          "/.netlify/functions/checkout-status?session_id=" +
          encodeURIComponent(sessionId),
          { cache: "no-store" }
        );

        if (!response.ok) {
          show("error");
          return;
        }

        const data = await response.json();
        show(data.status);

      } catch (_) {
        show("error");
      }
    }

    verify();
  </script>
</body>
</html>
